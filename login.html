<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Match-Me Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: '#FFF6E9',
                        softpink: '#FFCAD4',
                        skyblue: '#A0D2EB',
                        mintgreen: '#C7F0DB',
                        lavender: '#E0C3FC'
                    },
                    fontFamily: {
                        nunito: ['Nunito', 'sans-serif']
                    },
                    boxShadow: {
                        'soft': '0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.02)'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #FFF6E9;
        }
        .paw-btn {
            position: relative;
        }
        .paw-btn:after {
            content: "🐾";
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
        }
        .login-animation {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body class="bg-cream min-h-screen">
    <div class="min-h-screen flex items-center justify-center p-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-10 max-w-5xl bg-white rounded-3xl shadow-soft overflow-hidden">
            <!-- Left Column - Login Form -->
            <div class="p-8 md:p-12 flex flex-col justify-center">
                <div class="mb-8 text-center md:text-left">
                    <img src="https://images.unsplash.com/photo-1560807707-8cc77767d783?ixlib=rb-1.2.1&auto=format&fit=crop&w=100&h=100&q=80" 
                         alt="Match-Me Logo" class="w-20 h-20 rounded-full border-4 border-softpink shadow-md inline-block">
                </div>
                
                <h1 class="text-3xl font-bold text-purple-700 mb-2">Welcome Back!</h1>
                <p class="text-gray-600 mb-8">Sign in to connect with other pet lovers and their furry friends.</p>
                
                <form class="space-y-6">
                    <div>
                        <label class="block text-gray-700 text-sm font-medium mb-2">Email Address</label>
                        <div class="bg-gray-100 rounded-full px-6 py-4 flex items-center border border-mintgreen shadow-sm focus-within:ring-2 focus-within:ring-softpink focus-within:border-softpink">
                            <span class="text-gray-400 mr-3">📧</span>
                            <input type="email" placeholder="Enter your email" class="bg-transparent w-full focus:outline-none">
                        </div>
                    </div>
                    
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label class="block text-gray-700 text-sm font-medium">Password</label>
                            <a href="#" class="text-sm text-skyblue hover:underline">Forgot password?</a>
                        </div>
                        <div class="bg-gray-100 rounded-full px-6 py-4 flex items-center border border-mintgreen shadow-sm focus-within:ring-2 focus-within:ring-softpink focus-within:border-softpink">
                            <span class="text-gray-400 mr-3">🔒</span>
                            <input type="password" placeholder="Enter your password" class="bg-transparent w-full focus:outline-none">
                        </div>
                    </div>
                    
                    <div class="flex items-center">
                        <input type="checkbox" id="remember" class="rounded-md text-softpink focus:ring-softpink">
                        <label for="remember" class="ml-2 text-sm text-gray-600">Remember me on this device</label>
                    </div>
                    
                    <button class="paw-btn w-full bg-softpink hover:bg-pink-400 text-white font-bold py-4 px-8 rounded-full transition duration-300 shadow-md hover:shadow-lg">
                        Sign In
                    </button>
                </form>
                
                <div class="mt-8 text-center">
                    <span class="text-gray-600">New to Match-Me?</span>
                    <a href="#" class="text-skyblue hover:underline ml-1 font-semibold">Register now</a>
                </div>
                
                <div class="mt-8 pt-6 border-t border-gray-100 text-center">
                    <p class="text-sm text-gray-500 mb-4">Or continue with</p>
                    <div class="flex justify-center space-x-4">
                        <button class="bg-white border border-gray-200 rounded-full p-3 shadow-sm hover:shadow-md transition duration-300">
                            <span class="text-xl">🐶</span>
                        </button>
                        <button class="bg-white border border-gray-200 rounded-full p-3 shadow-sm hover:shadow-md transition duration-300">
                            <span class="text-xl">🐱</span>
                        </button>
                        <button class="bg-white border border-gray-200 rounded-full p-3 shadow-sm hover:shadow-md transition duration-300">
                            <span class="text-xl">🐰</span>
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- Right Column - Image and Info -->
            <div class="hidden md:block relative bg-gradient-to-r from-lavender to-skyblue">
                <div class="absolute inset-0 flex items-center justify-center">
                    <div class="text-center p-8 login-animation">
                        <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?ixlib=rb-1.2.1&auto=format&fit=crop&w=400&h=400&q=80" 
                             alt="Cute Dog" class="w-60 h-60 object-cover rounded-full border-8 border-white shadow-lg mx-auto mb-6">
                        <h2 class="text-2xl font-bold text-white mb-2">Find Perfect Playmates for Your Pets!</h2>
                        <p class="text-white text-opacity-90 mb-6">Connect with fellow pet lovers and schedule playdates in your neighborhood.</p>
                        <div class="flex justify-center space-x-2">
                            <span class="w-3 h-3 bg-white rounded-full"></span>
                            <span class="w-3 h-3 bg-white bg-opacity-60 rounded-full"></span>
                            <span class="w-3 h-3 bg-white bg-opacity-60 rounded-full"></span>
                        </div>
                    </div>
                </div>
                <div class="absolute bottom-0 left-0 right-0 h-40 bg-gradient-to-t from-lavender to-transparent"></div>
                <div class="absolute top-6 right-6">
                    <div class="bg-white bg-opacity-30 backdrop-blur-sm rounded-full px-4 py-2 text-white shadow-sm">
                        <span class="mr-2">🐾</span> 10,000+ happy pets
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
